<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shawties Guaranteed</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 1.5rem;
    font-family: Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #000000;
    line-height: 1.5;
  }

  .wrap { max-width: 700px; }

  h1 {
    margin: 0 0 0.25rem;
    font-size: 4.5rem;
    font-weight: bold;
    line-height: 1;
  }

  .tagline {
    margin: 0 0 1rem;
    font-size: 0.95rem;
    color: #333;
  }

  nav { margin-bottom: 1.5rem; }
  nav a {
    color: #0000EE;
    text-decoration: underline;
    margin-right: 1.25rem;
    font-size: 1rem;
  }
  nav a:visited { color: #551A8B; }

  hr {
    border: none;
    border-top: 1px solid #000;
    margin: 1rem 0 1.5rem;
  }

  h2.section-title {
    font-size: 1.4rem;
    font-weight: bold;
    margin: 0 0 0.75rem;
  }

  .section { margin-bottom: 2rem; }

  .see-all {
    display: inline-block;
    margin-top: 0.25rem;
    font-size: 0.9rem;
    color: #0000EE;
    text-decoration: underline;
  }

  /* recent photos grid */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-bottom: 0.75rem;
  }
  .photo-grid img,
  .photo-grid video {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
    border: 1px solid #000;
    background: #eee;
  }

  .empty-state {
    color: #555;
    font-style: italic;
  }

  /* recent posts list */
  article.post { margin-bottom: 1.5rem; }
  article.post .meta {
    font-size: 0.8rem;
    color: #555;
    margin-bottom: 0.2rem;
  }
  article.post h3 {
    margin: 0 0 0.3rem;
    font-size: 1.15rem;
    font-weight: bold;
  }
  article.post h3 a { color: #0000EE; text-decoration: underline; }
  article.post h3 a:visited { color: #551A8B; }
  article.post p.excerpt { margin: 0; color: #000; }

  footer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid #000;
    font-size: 0.8rem;
    color: #555;
  }
  footer a { color: #0000EE; text-decoration: underline; }
</style>
</head>
<body>

<div class="wrap">

  <h1>Shawties Guaranteed</h1>
  <p class="tagline">Notes, thoughts, and things worth remembering</p>

  <nav>
    <a href="#">Home</a>
    <a href="blog.html">Blog</a>
    <a href="gallery.html">Gallery</a>
  </nav>

  <hr>

  <div class="section">
    <h2 class="section-title">Recent Photos</h2>
    <div class="photo-grid" id="photoGrid"></div>
    <div class="empty-state" id="photoEmpty" style="display:none;">No uploads yet.</div>
    <a class="see-all" href="gallery.html">See the full gallery &rarr;</a>
  </div>

  <hr>

  <div class="section">
    <h2 class="section-title">Recent Posts</h2>
    <div id="postList"></div>
    <div class="empty-state" id="postEmpty" style="display:none;">No entries yet.</div>
    <a class="see-all" href="blog.html">Read the full blog &rarr;</a>
  </div>

  <footer>
    &copy; 2026 Shawties Guaranteed &middot; <a href="#">Home</a> &middot; <a href="blog.html">Blog</a> &middot; <a href="gallery.html">Gallery</a>
  </footer>

</div>

<script>
  const POSTS_KEY = 'shawtiesGuaranteedPosts';
  const MEDIA_KEY = 'shawtiesGuaranteedMedia';

  // fallback sample content, shown only if nothing has been posted yet
  const fallbackPosts = [
    { title: 'Why I Started Writing Again', date: 'August 20, 2026', body: "After a long break, I picked up a notebook and realized how much I'd missed the habit of putting thoughts into words." },
    { title: 'A Quiet Week in the Mountains', date: 'August 12, 2026', body: 'No agenda, no itinerary — just a cabin, a few books, and a lot of walking.' },
    { title: 'The Case for Slower Mornings', date: 'August 3, 2026', body: "Rushing out the door has become the default. I've been experimenting with a slower start to the day." }
  ];

  const photoGrid = document.getElementById('photoGrid');
  const photoEmpty = document.getElementById('photoEmpty');
  const postList = document.getElementById('postList');
  const postEmpty = document.getElementById('postEmpty');

  function loadRecentPhotos() {
    const saved = JSON.parse(localStorage.getItem(MEDIA_KEY) || '[]');
    const recent = saved.slice(0, 3);
    if (recent.length === 0) {
      photoEmpty.style.display = 'block';
      return;
    }
    recent.forEach((item) => {
      const el = item.type.startsWith('video')
        ? document.createElement('video')
        : document.createElement('img');
      el.src = item.dataUrl;
      if (item.type.startsWith('video')) el.muted = true;
      if (item.caption) el.alt = item.caption;
      photoGrid.appendChild(el);
    });
  }

  function loadRecentPosts() {
    const saved = JSON.parse(localStorage.getItem(POSTS_KEY) || '[]');
    const recent = saved.length > 0 ? saved.slice(0, 3) : fallbackPosts;
    if (recent.length === 0) {
      postEmpty.style.display = 'block';
      return;
    }
    recent.forEach((post) => {
      const article = document.createElement('article');
      article.className = 'post';
      article.innerHTML = `
        <div class="meta">${post.date}</div>
        <h3><a href="blog.html">${post.title}</a></h3>
        <p class="excerpt">${post.body}</p>
      `;
      postList.appendChild(article);
    });
  }

  loadRecentPhotos();
  loadRecentPosts();
</script>

</body>
</html>
