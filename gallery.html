<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shawties Guaranteed — Gallery</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 1.5rem;
    font-family: Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #000000;
    line-height: 1.5;
  }

  .wrap {
    max-width: 700px;
  }

  h1 {
    margin: 0 0 0.25rem;
    font-size: 4.5rem;
    font-weight: bold;
    line-height: 1;
  }

  .tagline {
    margin: 0 0 1rem;
    font-size: 0.95rem;
    color: #333;
  }

  nav {
    margin-bottom: 1.5rem;
  }
  nav a {
    color: #0000EE;
    text-decoration: underline;
    margin-right: 1.25rem;
    font-size: 1rem;
  }
  nav a:visited {
    color: #551A8B;
  }

  hr {
    border: none;
    border-top: 1px solid #000;
    margin: 1rem 0 1.5rem;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1rem;
  }

  .gallery-item {
    border: 1px solid #000;
    padding: 0.5rem;
    text-align: left;
  }

  .gallery-item .placeholder {
    background: #eee;
    border: 1px solid #999;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 0.8rem;
    margin-bottom: 0.5rem;
  }

  .gallery-item .caption {
    font-size: 0.85rem;
    color: #333;
  }

  footer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid #000;
    font-size: 0.8rem;
    color: #555;
  }
  footer a { color: #0000EE; text-decoration: underline; }
</style>
</head>
<body>

<div class="wrap">

  <h1>Shawties Guaranteed</h1>
  <p class="tagline">A few images worth keeping around</p>

  <nav>
    <a href="blog.html">Home</a>
    <a href="blog.html#posts">Blog</a>
    <a href="#">Gallery</a>
  </nav>

  <hr>

  <div class="gallery-grid">
    <div class="gallery-item">
      <div class="placeholder">Image 1</div>
      <div class="caption">Add a caption here</div>
    </div>
    <div class="gallery-item">
      <div class="placeholder">Image 2</div>
      <div class="caption">Add a caption here</div>
    </div>
    <div class="gallery-item">
      <div class="placeholder">Image 3</div>
      <div class="caption">Add a caption here</div>
    </div>
    <div class="gallery-item">
      <div class="placeholder">Image 4</div>
      <div class="caption">Add a caption here</div>
    </div>
  </div>

  <footer>
    &copy; 2026 Shawties Guaranteed &middot; <a href="blog.html">Home</a> &middot; <a href="blog.html#posts">Blog</a> &middot; <a href="#">Gallery</a>
  </footer>

</div>

</body>
</html>
